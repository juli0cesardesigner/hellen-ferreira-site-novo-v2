<?xml version="1.0" encoding="UTF-8"?>
<svg id="Camada_2" data-name="Camada 2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350">
  <defs>
    <style>
      .cls-bg { fill: #fff; }
      .cls-dark { fill: #141414; }
      .cls-mid { fill: #747572; }
      .cls-soft { fill: #737373; }
      .cls-accent { fill: #545454; }
    </style>
    <clipPath id="clip-t3b-l03">
      <rect width="1080" height="1350"/>
    </clipPath>
      <filter id="filter-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="10" dy="10" stdDeviation="7.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g clip-path="url(#clip-t3b-l03)">
    <!-- Foto 1 Fundo Seamless -->
    <rect id="foto1_fundo" class="cls-bg" width="1080" height="1350"/>
    <!-- Foto 3 Seamless L2-L3 (finaliza aos 420px) -->
    <rect id="foto3" class="cls-mid" x="-1080" y="0" width="1500" height="1350"/>
    <!-- Foto 7 Seamless L3-L4-L5 (inicia aos 917px) -->
    <rect id="foto7" class="cls-dark" x="917" y="0" width="1670" height="1350"/>
    <!-- Foto 5 Seamless L3-L4 (750x550, x: 505, y: 293) -->
    <rect id="foto5" class="cls-soft" x="505" y="293" width="750" height="550" filter="url(#filter-shadow)"/>
    <!-- Foto 6 Sobreposta (500x370, x: 251, y: 671) -->
    <rect id="foto6" class="cls-accent" x="251" y="671" width="500" height="370" filter="url(#filter-shadow)"/>
  </g>
</svg>

